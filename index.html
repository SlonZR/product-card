<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>product</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="catalog">
  
      <h1 class="title catalog__title">Выбери свой продукт</h1>
        
      <ul id="product-list">

        <template id="product-template">

          <li class="products-item card">
            <img class="product-image" src="" alt="">
            <span class="product-category"></span>
            <h2 class="product-name"></h2>
            <p class="product-description"></p>
            <span class="product-compound"></span>
          <ul class="compound-list">
            <li></li>
            <li></li>
            <li></li>
          </ul>
            <b class="product-price"></b>
            <span class="product-sell"></span>
          </li>
       </template>
      </ul>
      
      <button id="openModalBtn">Зарегистрироваться</button>
        
      <dialog id="regModal">
          <div class="modal-content">
            <button id="closeModalBtn" class="close-btn" aria-label="Закрыть">&times;</button>
              <h2>Регистрация</h2>
    
          <form id="regForm" method="dialog">

            <div class="form-group">
              <label for="name">Имя</label>
              <input type="text" id="username" name="username" placeholder="Введите имя">
            </div>

            <div class="form-group">
              <label for="lastname">Фамилия</label>
              <input type="text" id="lastname" name="lastname" required placeholder="Введите фамилию">
            </div>

            <div class="form-group">
              <label for="birthday">Дата рождения</label>
              <input type="date" id="birthday" name="birthday" placeholder="Введите дату рождения">
            </div>
      
            <div class="form-group">
              <label for="email">Электронная почта</label>
              <input type="email" id="email" name="email" placeholder="example@mail.com">
            </div>
      
            <div class="form-group">
              <label for="password">Пароль</label>
                <input type="password" id="password" name="password" minlength="6" placeholder="Пароль">
            </div>
            
            <div class="form-group"> 
              <label for="password-repeat">Повторите пароль</label> 
              <input type="password" id="password-repeat" name="password-repeat" required minlength="6" placeholder="Повторите пароль"> 
            </div> 
      
            <button type="submit" class="submit-btn">Создать аккаунт</button>
          </form>
        </div>
      </dialog>

</main>
<footer class="footer">
  <div class="footer__container">
    
    <div class="footer__info">
      <h3 class="footer__info-name">Product Cards</h3>
      <p class="footer__info-text">У Нас Самые Лучшие Продукты Для Кожи!</p>
        <ul class="footer__socials" aria-label="Социальные сети">
          <li><a href="https://t.me" target="_blank" style="font-size: 24px; color: white; text-decoration: none;">✉</a></li>
          <li><a href="https://vk.com" target="_blank" style="font-size: 24px; color: white; text-decoration: none;">🖧</a></li>
        </ul>

    </div>
    <div class="footer__subscribe">
      <p class="footer__subscribe-text">Подпишись на наши акции:</p>
        <form class = "footer__subscribe-form" id="emailForm">
          <input name="subscribe-email" type="email" placeholder="Введите свой Email" class="footer__subscribe-input" >
          <button class="footer__button" type="submit">Подписаться</button>
        </form>
     </div>
  
    <nav class="footer__menu">
        <p class="footer__menu-name">Быстрые ссылки</p>
        <ul class="footer__menu-list">
          <li><a href="#">Главная</a></li>
          <li><a href="#">Магазин</a></li>
          <li><a href="#">Контакты</a></li>
        </ul>
      </nav>
    
  </div>
  <a href="#" class="footer__copyright">www.product-cards.com©all right reserve</a>
</footer>
<script type="module" src="homework-10.js"></script>
<script type="module" src="homework-11.js"></script>
</body>
</html>
